<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Alegre</title>

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Carrega o React, ReactDOM e Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="header-content">
            <a href="#/" class="logo" onclick="event.preventDefault(); navegar('/')">
                <span class="logo-icon">V</span>
                <span>Vitrine <strong>Alegre</strong></span>
            </a>

            <div class="search-container">
                <span class="search-icon">⌕</span>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar produtos..."
                    autocomplete="off"
                    aria-label="Buscar produtos"
                >
            </div>

            <div class="header-actions">
                <button
                    class="login-button"
                    onclick="alert('Área de login em desenvolvimento.')"
                >
                    Entrar
                </button>

                <!-- BOTÃO DE FAVORITOS -->
                <button
                    class="cart-header-button"
                    onclick="navegar('/favoritos')"
                    title="Ver Favoritos"
                >
                    <span class="cart-icon">❤️</span>
                    <span class="cart-number" id="favCount">0</span>
                    <span>Favoritos</span>
                </button>

                <!-- BOTÃO DE CARRINHO -->
                <button
                    class="cart-header-button"
                    onclick="navegar('/carrinho')"
                    title="Ver Carrinho"
                >
                    <span class="cart-icon">🛒</span>
                    <span class="cart-number" id="cartCount">0</span>
                    <span>Carrinho</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MENU MOBILE -->
    <div class="mobile-menu">
        <button onclick="toggleMobileMenu()" id="mobileMenuButton" aria-label="Abrir menu de navegação">
            ☰
        </button>
    </div>

    <!-- APLICAÇÃO REACT -->
    <main id="app"></main>

    <!-- RODAPÉ -->
    <footer class="footer">
        <div class="footer-content">
            <div>
                <div class="footer-logo">
                    <span class="logo-icon">V</span>
                    <span>Vitrine <strong>Alegre</strong></span>
                </div>
                <p>Projeto acadêmico · Ifes Campus de Alegre · TADS</p>
            </div>

            <div class="footer-right">
                <p>Dados: dummyjson.com</p>
                <p>Imagens e produtos são fictícios</p>
            </div>
        </div>
    </footer>

    <!-- Script React processado pelo Babel -->
    <script type="text/babel" src="script.js"></script>
</body>
</html>
